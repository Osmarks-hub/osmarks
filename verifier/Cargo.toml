[package]
name = "osmarks-verify"
description = "Check osmarks marks and the public log offline, without trusting osmarks."
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = "2"
